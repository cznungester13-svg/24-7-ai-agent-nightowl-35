      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0ea5a4"/>
    </linearGradient>
    <style>
      .title{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill:#fff; font-weight:700; font-size:48px}
      .sub{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill:rgba(255,255,255,0.9); font-size:20px}
